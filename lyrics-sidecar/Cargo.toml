[package]
name = "lyrics-sidecar"
version = "0.1.0"
edition = "2021"
description = "Spotify's own synced lyrics and live playback state for Track Banner, via librespot."
license = "MIT"

[[bin]]
name = "lyrics-sidecar"
path = "src/main.rs"

[dependencies]
librespot-core = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-oauth = { version = "0.8", default-features = false, features = ["rustls-tls-native-roots"] }
librespot-protocol = { version = "0.8", default-features = false }
protobuf = "3.7"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }
anyhow = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
